services:
  postgres:
    image: postgres:17-alpine
    container_name: oxus-poc-postgres
    environment:
      POSTGRES_DB: oxus_poc
      POSTGRES_USER: oxus_poc
      POSTGRES_PASSWORD: oxus_poc
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxus_poc -d oxus_poc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
